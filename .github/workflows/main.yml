
name: Build Zoo Tycoon Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e
          if [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::Android SDK tidak ditemukan di runner."
            exit 1
          fi

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager tidak ditemukan."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Android SDK ditemukan."

      - name: Accept licenses and install SDK packages
        shell: bash
        run: |
          set -e
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses \
            || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Download Godot 4.4.1
        shell: bash
        run: |
          set -e
          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip" \
            -O /tmp/godot.zip

          unzip -oq /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -maxdepth 1 \
            -type f -name 'Godot*' | head -n 1)"

          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Install Godot export templates
        shell: bash
        run: |
          set -e
          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" \
            -O /tmp/templates.tpz

          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -oq /tmp/templates.tpz -d /tmp/godot-templates

          TEMPLATE="$(find /tmp/godot-templates \
            -name android_debug.apk -type f | head -n 1)"

          if [ -z "$TEMPLATE" ]; then
            echo "::error::Template Android tidak ditemukan."
            exit 1
          fi

          cp -a "$(dirname "$TEMPLATE")/." \
            "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 1 -type f \
            -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Upload ZIP proyek ke root repository."
            exit 1
          fi

          mkdir -p project
          unzip -oq "$ZIP_FILE" -d project

          PROJECT_FILE="$(find project -name project.godot \
            -type f | head -n 1)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::project.godot tidak ditemukan dalam ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Import Godot resources
        shell: bash
        run: |
          set -e
          "$GODOT_BIN" --headless --editor \
            --path "$PROJECT_DIR" --import

      - name: Verify Android export preset
        shell: bash
        run: |
          set -e
          if ! grep -q 'name="Android"' \
            "$PROJECT_DIR/export_presets.cfg"; then
            echo "::error::Preset Android tidak ditemukan. Periksa export_presets.cfg."
            exit 1
          fi

      - name: Export APK
        shell: bash
        run: |
          set -e
          mkdir -p "$PROJECT_DIR/build"

          "$GODOT_BIN" --headless \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$PROJECT_DIR/build/ZooTycoon.apk"

          test -s "$PROJECT_DIR/build/ZooTycoon.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZooTycoon-Android-APK
          path: ${{ env.PROJECT_DIR }}/build/ZooTycoon.apk
          if-no-files-found: error
          retention-days: 14
