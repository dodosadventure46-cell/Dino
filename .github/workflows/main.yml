name: Build Zoo Tycoon APK (langsung dari ZIP)

# Taruh file ini di repo pada path: .github/workflows/build-apk.yml
# Upload juga Zoo_Tycoon_Godot_GitHub.zip ke root repo (TIDAK perlu diekstrak).

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

env:
  GODOT_VERSION: "4.4.1"
  PRESET_NAME: "Android"
  APK_NAME: "ZooTycoon.apk"

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ekstrak ZIP proyek di runner
        shell: bash
        run: |
          set -euo pipefail
          ZIP=""
          while IFS= read -r z; do
            if unzip -l "$z" | grep -q 'project\.godot'; then ZIP="$z"; break; fi
          done < <(find . -maxdepth 2 -type f -name '*.zip' -not -path './.git/*')

          if [ -n "$ZIP" ]; then
            echo "ZIP ditemukan: $ZIP"
            mkdir -p "$GITHUB_WORKSPACE/_game"
            unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/_game"
            PROJECT_FILE="$(find "$GITHUB_WORKSPACE/_game" -type f -name project.godot | head -n 1)"
          elif [ -f project.godot ]; then
            echo "Tidak ada ZIP, memakai project.godot di root repo"
            PROJECT_FILE="$GITHUB_WORKSPACE/project.godot"
          else
            echo "::error::Tidak menemukan ZIP berisi project.godot di repo"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Folder proyek: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"
          test -f "$PROJECT_DIR/export_presets.cfg" || { echo "::error::export_presets.cfg tidak ada"; exit 1; }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install komponen Android SDK
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" "platforms;android-35" \
            "build-tools;34.0.0" "build-tools;35.0.1" \
            "cmake;3.10.2.4988404" || true
          yes | sdkmanager --licenses > /dev/null || true

      - name: Download Godot dan export templates
        shell: bash
        run: |
          set -euo pipefail
          V="$GODOT_VERSION"
          BASE="https://github.com/godotengine/godot/releases/download/${V}-stable"
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/${V}.stable"

          curl -L --fail --retry 3 "$BASE/Godot_v${V}-stable_linux.x86_64.zip" -o "$HOME/godot/godot.zip"
          unzip -q "$HOME/godot/godot.zip" -d "$HOME/godot/bin"
          GODOT_BIN="$(find "$HOME/godot/bin" -type f -name 'Godot_v*' | head -n 1)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          curl -L --fail --retry 3 "$BASE/Godot_v${V}-stable_export_templates.tpz" -o "$HOME/godot/templates.tpz"
          unzip -q "$HOME/godot/templates.tpz" -d "$HOME/godot/templates"
          cp -a "$HOME/godot/templates/templates/." "$HOME/.local/share/godot/export_templates/${V}.stable/"
          ls "$HOME/.local/share/godot/export_templates/${V}.stable/" | head -n 20

      - name: Buat debug keystore dan setting editor Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" -noprompt

          # Keystore debug lewat environment variable (didukung Godot 4)
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"

          # Setting editor: lokasi Android SDK dan Java
          for f in editor_settings-4.tres editor_settings-4.4.tres; do
            cat > "$HOME/.config/godot/$f" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done
          # Hapus indentasi YAML yang ikut terbawa di heredoc
          sed -i 's/^ *//' "$HOME/.config/godot/editor_settings-4.tres" "$HOME/.config/godot/editor_settings-4.4.tres"
          cat "$HOME/.config/godot/editor_settings-4.4.tres"

      - name: Import resource proyek
        shell: bash
        run: |
          "$GODOT_BIN" --headless --path "$PROJECT_DIR" --import || true
          "$GODOT_BIN" --headless --path "$PROJECT_DIR" --import || true

      - name: Export debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build"
          "$GODOT_BIN" --headless --path "$PROJECT_DIR" \
            --export-debug "$PRESET_NAME" "$GITHUB_WORKSPACE/build/$APK_NAME"
          ls -la "$GITHUB_WORKSPACE/build"
          test -s "$GITHUB_WORKSPACE/build/$APK_NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZooTycoon-Android-APK
          path: build/ZooTycoon.apk
          if-no-files-found: error
          retention-days: 14
