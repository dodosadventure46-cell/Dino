
name: Build Zoo Tycoon Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Tidak ditemukan ZIP proyek di root repository."
            exit 1
          fi

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          PROJECT_FILE="$(find project -name project.godot -type f | head -n 1)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::project.godot tidak ditemukan dalam ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Install Java and Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.4.1"
          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot*' | head -n 1)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Install Godot export templates
        shell: bash
        run: |
          set -euo pipefail
          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" \
            -O /tmp/templates.tpz

          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot_templates

          TEMPLATE="$(find /tmp/godot_templates -name android_debug.apk -type f | head -n 1)"
          if [ -z "$TEMPLATE" ]; then
            echo "::error::Template Android Godot tidak ditemukan."
            exit 1
          fi

          cp -a "$(dirname "$TEMPLATE")/." \
            "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Import project resources
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path "$PROJECT_DIR" --import

      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_DIR/build"

          "$GODOT_BIN" --headless --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$PROJECT_DIR/build/ZooTycoon.apk"

          test -s "$PROJECT_DIR/build/ZooTycoon.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZooTycoon-Android-APK
          path: ${{ env.PROJECT_DIR }}/build/ZooTycoon.apk
          if-no-files-found: error
          retention-days: 14
